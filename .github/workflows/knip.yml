name: Knip

on:
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "views/**"
      - "scripts/**"
      - ".storybook/**"
      - "cypress/**"
      - "package.json"
      - "bun.lock"
      - "knip.jsonc"
      - "prisma/**"
      - "*.config.*"
      - "vitest.*.ts"
      - "instrumentation-client.ts"
      - "tsconfig.json"
      - ".github/workflows/knip.yml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "src/**"
      - "views/**"
      - "scripts/**"
      - ".storybook/**"
      - "cypress/**"
      - "package.json"
      - "bun.lock"
      - "knip.jsonc"
      - "prisma/**"
      - "*.config.*"
      - "vitest.*.ts"
      - "instrumentation-client.ts"
      - "tsconfig.json"
      - ".github/workflows/knip.yml"

jobs:
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: copy .env file
        run: cp .env.example .env

      - run: bun install

      # `knip` is a pinned devDependency, so `bunx knip` runs that version.
      # The production pass cannot see dotenv and jiti, which only
      # next.config.js and prisma.config.ts import, so knip.jsonc ignores them.
      - name: Check unlisted and unused dependencies
        run: bunx knip --production --exclude files,exports,types

      # Default mode counts tests, stories and tool config as users, so this
      # step reports only files, exports and types that nothing reaches.
      - name: Check unused files, exports and types
        run: bunx knip
