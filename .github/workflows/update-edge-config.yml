name: Update Edge Config

on:
  push:
    branches:
      - "main"
    paths:
      - "src/server/ecfg/**"

jobs:
  update-edge-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: copy .env file
        run: cp .env.example .env

      - run: bun install

      - name: Validate Edge Config
        run: bun run ecfg:test

      - name: Update Edge Config
        run: bun run ecfg:update -- ${{ secrets.VERCEL_TOKEN }} ${{ secrets.VERCEL_EDGE_CONFIG_ID }} src/server/ecfg/config.json

      - name: Revalidate Edge Config cache
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Invalidate the app's cached edge-config read so the new config
          # propagates without waiting for the 24h window or a deploy.
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret not set - skipping cache revalidation"
            exit 0
          fi
          curl --fail-with-body -sS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/revalidate-edge-config"

