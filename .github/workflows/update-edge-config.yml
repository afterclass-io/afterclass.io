name: Update Edge Config

on:
  push:
    branches:
      - "main"
    paths:
      - "src/server/ecfg/config.json"

jobs:
  update-edge-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: copy .env file
        run: cp .env.example .env

      - run: bun install

      - name: Validate Edge Config
        run: bun run ecfg:test

      - name: Seed missing Edge Config keys
        run: bun run ecfg:seed -- --apply
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_EDGE_CONFIG_ID: ${{ secrets.VERCEL_EDGE_CONFIG_ID }}
